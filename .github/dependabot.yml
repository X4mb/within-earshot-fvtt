# Dependabot keeps dev dependencies and GitHub Actions up to date.
# PRs open against `test` (the staging branch) so updates are validated by CI
# and tested in Foundry before they can reach a live release from `main`.
version: 2
updates:
  # npm dev toolchain (esbuild, typescript, archiver, foundry-vtt-types)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "test"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for routine dev-tooling patch/minor bumps keeps noise down.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI / release workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "test"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
